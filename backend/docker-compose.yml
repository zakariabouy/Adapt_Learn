version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: adaptlearn
      POSTGRES_USER: adaptlearn
      POSTGRES_PASSWORD: adaptlearn_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./migrations/002_question_bank.sql:/docker-entrypoint-initdb.d/002_question_bank.sql:ro
      - ./migrations/003_teacher_student_link.sql:/docker-entrypoint-initdb.d/003_teacher_student_link.sql:ro
      - ./migrations/004_gamification.sql:/docker-entrypoint-initdb.d/004_gamification.sql:ro
      - ./migrations/005_grade_level.sql:/docker-entrypoint-initdb.d/005_grade_level.sql:ro
      - ./migrations/006_rag_vectors.sql:/docker-entrypoint-initdb.d/006_rag_vectors.sql:ro
      - ./migrations/007_guardrails.sql:/docker-entrypoint-initdb.d/007_guardrails.sql:ro
      - ./migrations/008_parents_admin.sql:/docker-entrypoint-initdb.d/008_parents_admin.sql:ro
      - ./migrations/009_communication_feedback.sql:/docker-entrypoint-initdb.d/009_communication_feedback.sql:ro
      - ./migrations/010_anti_addiction.sql:/docker-entrypoint-initdb.d/010_anti_addiction.sql:ro
      - ./migrations/011_profile_enrichment.sql:/docker-entrypoint-initdb.d/011_profile_enrichment.sql:ro
      - ./migrations/012_orientation.sql:/docker-entrypoint-initdb.d/012_orientation.sql:ro
      - ./migrations/013_pending_actions.sql:/docker-entrypoint-initdb.d/013_pending_actions.sql:ro
      - ./migrations/014_student_exams.sql:/docker-entrypoint-initdb.d/014_student_exams.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
